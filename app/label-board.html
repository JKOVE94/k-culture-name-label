<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>포카 템플릿 비교 보드</title>
<style>body { margin: 0; background: #fff6ee; } canvas { width: 100%; height: auto; display: block; }</style></head>
<body>
<canvas id="b"></canvas>
<script type="module">
// 회의용 비교 보드: 사진 케이스 3가지(인물 / 활동·풍경 / 사진 없음) × 케이스별 템플릿 3종 = 9장
// ?mode=dither 디더링, ?lang=ja 한국인 카드, ?save=파일이름 이면 서버로 PNG 전송(개발용)
import { renderLabel, renderLabelColor, PRINTERS, TEMPLATES, PHOTO_CASES, templatesFor } from './label.mjs';
await document.fonts.ready;
const q = new URLSearchParams(location.search);
const load = async src => { const i = new Image(); i.src = src; await i.decode(); return i; };
const P = await load(q.get('p') || './sample-test.jpg'), L = await load(q.get('l') || './sample-landscape.jpg');
const d = q.get('lang') === 'ja'
  ? { big: 'キム・ミンジュンさん', segs: [{ text: '김민준' }], bigLang: 'ja', hon: 'san', no: 7 }
  : { big: '다나카 상', segs: [{ text: '田中', rt: 'たなか' }, { text: 'さん' }], bigLang: 'ko', hon: 'san', no: 42 };
const kinds = [['portrait', P, '1-1 인물 사진'], ['scene', L, '1-2 활동·풍경'], ['none', null, '2 사진 없음']];
const tpls = [0, 1, 2];
const cw = 360, ch = Math.round(cw * 945 / 567), gap = 60, left = 150, top = 150;
const b = document.getElementById('b');
b.width = left + tpls.length * (cw + gap); b.height = top + kinds.length * (ch + gap) + 20;
const g = b.getContext('2d');
g.fillStyle = '#fff6ee'; g.fillRect(0, 0, b.width, b.height);
['#ff6f91', '#ffc75f', '#7fd8c3', '#8ec5ff', '#c3a6ff'].forEach((c, i) => { g.fillStyle = c; g.fillRect(i * b.width / 5, 0, b.width / 5 + 1, 16); });
g.fillStyle = '#3b2f3a'; g.font = '800 46px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
g.fillText(q.get('mode') === 'color' ? '이름 카드 9종 — 방문자 폰 저장용 컬러 (인쇄는 같은 디자인 흑백)' : `이름 포토카드 템플릿 9종 (54×80 흑백 감열, 사진 ${q.get('mode') === 'dither' ? '디더링' : '회색조'})`, 40, 76);
g.font = '700 30px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif';
tpls.forEach((t, i) => g.fillText(`템플릿 ${i + 1}`, left + i * (cw + gap), 132));
const work = document.createElement('canvas');
kinds.forEach(([kind, photo, label], r) => {
  const y = top + r * (ch + gap);
  g.save(); g.translate(60, y + ch / 2); g.rotate(-Math.PI / 2); g.textAlign = 'center'; g.fillStyle = '#3b2f3a'; g.fillText(label, 0, 0); g.restore();
  templatesFor(kind).forEach((t, i) => {
    const dd = { ...d, tpl: t, photo, photoKind: photo ? (kind === 'portrait' ? 'portrait' : 'landscape') : undefined, date: Date.parse('2027-01-10T03:00:00Z') };
    if (q.get('mode') === 'color') renderLabelColor(work, dd, 2);
    else renderLabel(work, dd, PRINTERS.B1_PRO, '54x80', q.get('mode') || 'gray');
    const x = left + i * (cw + gap);
    g.fillStyle = '#d9cfc8'; g.fillRect(x + 6, y + 6, cw, ch);
    g.drawImage(work, x, y, cw, ch);
    g.fillStyle = '#3b2f3a'; g.font = '700 22px "Apple SD Gothic Neo", "Noto Sans KR", sans-serif'; g.textAlign = 'left';
    g.fillText(q.get('lang') === 'ja' ? TEMPLATES[t].kr : TEMPLATES[t].ko, x, y + ch + 26);
  });
});
if (q.get('save')) b.toBlob(blob => fetch('/' + q.get('save'), { method: 'POST', body: blob }).then(() => { document.title = 'saved'; }));
else document.title = 'ready';
</script>
</body></html>
