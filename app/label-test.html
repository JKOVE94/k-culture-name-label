<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>라벨 흑백 미리보기</title>
<style>
  body { margin: 8px; background: #eee; font-family: sans-serif; }
  .grid { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
  canvas { background: #fff; image-rendering: pixelated; height: 370px; width: auto; }
  canvas.small { height: 120px; }
</style></head>
<body>
<div class="grid" id="g"></div>
<script type="module">
import { renderLabel, PRINTERS } from './label.mjs';
const samples = [
  { big: '다나카 상', segs: [{ text: '田中', rt: 'たなか' }, { text: 'さん' }], hon: 'san', no: 1 },
  { big: '하루토 군', segs: [{ text: '大翔', rt: 'はると' }, { text: 'くん' }], hon: 'kun', no: 42 },
  { big: '사쿠라 짱', segs: [{ text: 'さくら' }, { text: 'ちゃん' }], hon: 'chan', no: 128 },
  { big: 'キム・ミンジュンさん', segs: [{ text: '김민준' }], bigLang: 'ja', hon: 'san', no: 7 },
];
await document.fonts.ready;
const size = new URLSearchParams(location.search).get('size') || '50x80';
for (const s of samples) {
  const c = document.createElement('canvas'); if (size === '50x30') c.className = 'small';
  document.getElementById('g').append(c); renderLabel(c, { ...s, date: Date.parse('2027-01-10T03:00:00Z') }, PRINTERS.B1_PRO, size);
}
</script>
</body></html>
