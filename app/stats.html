<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b2f3a">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>통계 · 이름 라벨 부스</title>
<style>
  :root { --ink:#3b2f3a; --sub:#8a7b86; --pink:#f0628f; --mint:#7fd8c3; --yellow:#ffd66b; --cream:#fff6ee; --sky:#8ec5ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: "Apple SD Gothic Neo", "Hiragino Sans", sans-serif; background: var(--cream); color: var(--ink); }
  header { background: var(--ink); color: #fff; padding: 14px 16px; }
  header h1 { font-size: 17px; margin: 0; }
  main { max-width: 560px; margin: 0 auto; padding: 14px; }
  .card { background: #fff; border: 2px solid var(--ink); border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 3px 3px 0 var(--ink); }
  .title { font-weight: 800; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button, select { font-family: inherit; font-size: 14px; font-weight: 700; border: 2px solid var(--ink); border-radius: 12px; padding: 9px 12px; background: #fff; color: var(--ink); }
  button.mint { background: var(--mint); } button.pink { background: var(--pink); color: #fff; }
  button:disabled { opacity: .4; }
  textarea { width: 100%; font-size: 12px; border: 2px solid var(--ink); border-radius: 10px; padding: 8px; margin-top: 8px; }
  .sub { font-size: 12px; color: var(--sub); }
  .video-wrap { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 1; margin-top: 10px; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .big div { background: var(--cream); border-radius: 12px; padding: 10px 4px; }
  .big b { display: block; font-size: 26px; }
  .bars { display: grid; grid-template-columns: auto 1fr auto; gap: 6px 8px; align-items: center; font-size: 13px; }
  .bar { height: 14px; border-radius: 7px; background: var(--sky); min-width: 2px; }
  .bars .n { font-weight: 700; text-align: right; }
  .dev { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #e5d9d4; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header><h1>📊 이름 라벨 부스 통계</h1></header>
<main>
  <section class="card">
    <div class="title">1. 인쇄 폰의 기록 가져오기</div>
    <div class="row">
      <button class="mint" id="scanBtn">📷 기록 QR 스캔</button>
      <button id="fileBtn">📄 파일 선택</button>
      <button id="sbBtn" hidden>☁️ Supabase에서 불러오기</button>
      <input type="file" id="file" accept=".json,application/json,text/plain" multiple hidden>
    </div>
    <div class="video-wrap" id="videoWrap" hidden><video id="video" playsinline muted></video></div>
    <textarea id="paste" rows="3" placeholder="인쇄 폰에서 「텍스트 복사」한 내용을 붙여 넣으세요"></textarea>
    <div class="row" style="margin-top:6px"><button id="pasteBtn">붙여 넣은 내용 추가</button></div>
    <div id="devices" style="margin-top:10px"></div>
  </section>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <div class="title" style="margin:0">2. 결과</div>
      <select id="day"></select>
    </div>
    <div class="big" style="margin-top:10px">
      <div><b id="total">0</b><span class="sub">방문(인쇄)</span></div>
      <div><b id="reprints">0</b><span class="sub">재인쇄</span></div>
      <div><b id="days">0</b><span class="sub">일수</span></div>
    </div>
    <div class="title" style="margin-top:14px">언어</div><div class="bars" id="byDir"></div>
    <div class="title" style="margin-top:14px">성별 (스태프 입력)</div><div class="bars" id="byGender"></div>
    <div class="title" style="margin-top:14px">연령층 (스태프 입력)</div><div class="bars" id="byAge"></div>
    <div class="title" style="margin-top:14px">시간대</div><div class="bars" id="byHour"></div>
    <div class="title" style="margin-top:14px" id="byDayTitle">일자별</div><div class="bars" id="byDay"></div>
    <div class="title" style="margin-top:14px">인쇄 폰별 (재인쇄 포함)</div><div class="bars" id="byDevice"></div>
  </section>

  <section class="card">
    <div class="title">3. 내보내기 · 정리</div>
    <div class="row"><button class="pink" id="csvBtn">CSV 다운로드 (엑셀)</button><button id="resetBtn">이 화면의 기록 모두 지우기</button></div>
    <p class="sub">이 화면은 받은 기록을 이 폰 안에 보관해요. 인쇄 폰의 원본 기록은 지워지지 않아요. 방문자 이름은 어디에도 저장되지 않아요.</p>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="./vendor/jsQR.js"></script>
<script type="module">
import { parseImport, merge, aggregate, toCsv, GENDER, AGE } from './stats-core.mjs';
import * as SB from './supabase.mjs';

const $ = id => document.getElementById(id);
const toast = m => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2000); };
const KEY = 'nl-agg-v1';
const store = JSON.parse(localStorage.getItem(KEY) || 'null') ?? { devices: {}, events: {}, parts: {} };
const save = () => localStorage.setItem(KEY, JSON.stringify(store));

function add(batches, label) {
  for (const b of batches) if (b.total) {
    const p = (store.parts[b.devId] ??= { total: b.total, got: [] });
    if (p.total !== b.total) { p.total = b.total; p.got = []; }   // 새로 내보낸 QR 묶음
    if (!p.got.includes(b.part)) p.got.push(b.part);
  }
  const n = merge(store, batches); save(); render();
  toast(`${label}: 새 기록 ${n}건 추가`);
}
const tryImport = (text, label) => { try { add(parseImport(text), label); } catch (e) { toast(e.message); } };

$('fileBtn').onclick = () => $('file').click();
$('file').onchange = async () => { for (const f of $('file').files) tryImport(await f.text(), f.name); $('file').value = ''; };
$('pasteBtn').onclick = () => { if ($('paste').value.trim()) { tryImport($('paste').value, '붙여넣기'); $('paste').value = ''; } };

if (SB.enabled()) {
  $('sbBtn').hidden = false;
  $('sbBtn').onclick = async () => {
    try {
      const rows = await SB.fetchEvents();
      const byDev = {};
      for (const r of rows) (byDev[r.dev] ??= { devId: r.dev, devName: r.devName, events: [] }).events.push(r);
      add(Object.values(byDev), 'Supabase');
    } catch (e) { toast(e.message); }
  };
}

// ── QR 연속 스캔 ──
let stream = null, raf = 0, lastText = '';
const work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });
$('scanBtn').onclick = async () => {
  if (stream) return stop();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
    $('video').srcObject = stream; await $('video').play(); $('videoWrap').hidden = false; $('scanBtn').textContent = '⏹ 스캔 멈추기';
    let last = 0;
    const tick = t => {
      raf = requestAnimationFrame(tick);
      if (t - last < 150) return; last = t;
      const v = $('video'); if (!v.videoWidth) return;
      const s = Math.min(v.videoWidth, v.videoHeight, 800);
      work.width = work.height = s;
      wctx.drawImage(v, (v.videoWidth - s) / 2, (v.videoHeight - s) / 2, s, s, 0, 0, s, s);
      const code = window.jsQR(wctx.getImageData(0, 0, s, s).data, s, s, { inversionAttempts: 'dontInvert' });
      if (!code) return;
      const text = new TextDecoder().decode(new Uint8Array(code.binaryData));
      if (text === lastText) return; lastText = text;
      if (!text.startsWith('NLS1:')) return toast('통계 QR이 아니에요');
      navigator.vibrate?.(60); tryImport(text, 'QR');
    };
    raf = requestAnimationFrame(tick);
  } catch (e) { toast('카메라를 열 수 없어요: ' + e.message); }
};
function stop() { cancelAnimationFrame(raf); stream?.getTracks().forEach(t => t.stop()); stream = null; $('videoWrap').hidden = true; $('scanBtn').textContent = '📷 기록 QR 스캔'; }

// ── 화면 ──
const kstDay = at => new Date(at + 9 * 3600e3).toISOString().slice(0, 10);
const LABEL = {
  dir: { ja2ko: '일본 이름 → 한글', ko2ja: '한국 이름 → 가타카나' },
  gender: Object.fromEntries(GENDER), age: Object.fromEntries(AGE),
};
function bars(el, obj, order, label = k => k) {
  const keys = order ?? Object.keys(obj).sort();
  const max = Math.max(1, ...keys.map(k => obj[k] ?? 0));
  el.innerHTML = keys.map(k => `<span>${label(k)}</span><div class="bar" style="width:${((obj[k] ?? 0) / max) * 100}%"></div><span class="n">${obj[k] ?? 0}</span>`).join('')
    || '<span class="sub">기록 없음</span>';
}
function render() {
  const all = Object.values(store.events);
  const days = [...new Set(all.map(e => kstDay(e.at)))].sort();
  const sel = $('day').value;
  $('day').innerHTML = `<option value="">전체 기간</option>` + days.map(d => `<option ${d === sel ? 'selected' : ''}>${d}</option>`).join('');
  const evs = sel ? all.filter(e => kstDay(e.at) === sel) : all;
  const a = aggregate(evs, store.devices);
  $('total').textContent = a.total; $('reprints').textContent = a.reprints; $('days').textContent = Object.keys(a.byDay).length;
  bars($('byDir'), a.byDir, ['ja2ko', 'ko2ja'], k => LABEL.dir[k]);
  bars($('byGender'), a.byGender, GENDER.map(g => g[0]), k => LABEL.gender[k]);
  bars($('byAge'), a.byAge, AGE.map(x => x[0]), k => LABEL.age[k]);
  const hours = Object.keys(a.byHour).map(Number);
  bars($('byHour'), a.byHour, hours.length ? Array.from({ length: Math.max(...hours) - Math.min(...hours) + 1 }, (_, i) => String(Math.min(...hours) + i)) : [], h => `${h}시`);
  $('byDayTitle').hidden = $('byDay').hidden = !!sel;
  bars($('byDay'), a.byDay);
  bars($('byDevice'), a.byDevice);
  $('devices').innerHTML = Object.entries(store.devices).map(([id, name]) => {
    const n = all.filter(e => e.dev === id).length, p = store.parts[id];
    const q = p ? ` · QR ${p.got.length}/${p.total}${p.got.length < p.total ? ' (남은 QR도 스캔하세요)' : ' ✓'}` : '';
    return `<div class="dev"><span>📱 ${name}</span><span>${n}건${q}</span></div>`;
  }).join('') || '<div class="sub">아직 받은 기록이 없어요</div>';
}
$('day').onchange = render;
$('csvBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([toCsv(Object.values(store.events), store.devices)], { type: 'text/csv' }));
  a.download = `name-label-stats-${kstDay(Date.now())}.csv`; a.click();
};
$('resetBtn').onclick = () => { if (confirm('이 화면에 모은 기록을 모두 지울까요? (인쇄 폰의 원본은 그대로예요)')) { store.devices = {}; store.events = {}; store.parts = {}; save(); render(); } };
render();
navigator.serviceWorker?.register('./sw.js').catch(() => {});
</script>
</body>
</html>
